<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>SECourses TRELLIS Studio</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- isometric cube: image -> 3D asset -->
  <g transform="translate(32 34)">
    <path d="M0 -20 L18 -10 L0 0 L-18 -10 Z" fill="url(#top)"/>
    <path d="M-18 -10 L0 0 L0 20 L-18 10 Z" fill="url(#left)"/>
    <path d="M18 -10 L18 10 L0 20 L0 0 Z" fill="url(#right)"/>
    <path d="M0 -20 L18 -10 L18 10 L0 20 L-18 10 L-18 -10 Z"
          fill="none" stroke="#0f172a" stroke-width="1.6" stroke-linejoin="round" opacity=".55"/>
    <path d="M0 -20 L0 0 M-18 -10 L0 0 L18 -10"
          fill="none" stroke="#0f172a" stroke-width="1.4" stroke-linejoin="round" opacity=".35"/>
  </g>

  <!-- generation spark -->
  <path d="M50 12 l1.9 4.6 4.6 1.9 -4.6 1.9 -1.9 4.6 -1.9 -4.6 -4.6 -1.9 4.6 -1.9 Z" fill="#fde68a"/>
</svg>
